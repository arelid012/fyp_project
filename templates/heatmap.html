<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <script src="https://kit.fontawesome.com/d21aa4c3aa.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script src="https://cdn.plot.ly/plotly-3.0.0.min.js"></script>
    <style>
        body {
            background-color: #f4f4f9;
            font-family: 'Arial', sans-serif;
            overflow-x: hidden;
        }

       /* Sidebar Styles */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            background: linear-gradient(180deg, #004d61, #00897b);
            color: white;
            overflow-y: auto;
            transition: transform 0.5s ease, box-shadow 0.5s;
            z-index: 10;
            box-shadow: 4px 0 10px rgba(0, 0, 0, 0.1);
        }
        .sidebar.hidden {
            transform: translateX(-100%);
        }
        .sidebar .menu-label img {
            max-width: 100px;
            margin: 20px auto;
            display: block;
        }
        .sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .sidebar ul li {
            margin: 10px 0;
        }
        .sidebar ul li a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            border-radius: 8px;
            transition: background-color 0.3s, transform 0.3s;
        }
        .sidebar ul li a:hover {
            background-color: #a0e4d1;
            color: #004d61;
            transform: scale(1.05);
        }
        .sidebar ul li a span {
            margin-left: 10px;
        }
        .sidebar ul li hr {
            border: 0.5px solid #666;
        }

        /* Sidebar Toggle Button */
        .toggle-sidebar {
            position: fixed;
            top: 20px;
            left: 270px;
            background-color: #004d61;
            color: white;
            padding: 12px 15px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 11;
            transition: left 0.5s ease, transform 0.3s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .toggle-sidebar.hidden {
            left: 20px;
            transform: rotate(180deg);
        }

        .sidebar-logo {
    max-width: 150px;
    margin: 20px auto;
    display: block;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
}

        /* Main Content Styling */
        .main-content {
            margin-left: 270px;
            padding: 20px;
            transition: margin-left 0.5s ease;
        }
        .main-content.collapsed {
            margin-left: 50px;
        }


        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 1s ease;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: bold;
            color: #004d61;
        }

        /* Cards */
        .card {
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .card-header {
            background-color: #3273dc;
            color: white;
            padding: 10px 20px;
            font-size: 1.2rem;
            text-align: center;
        }

        .card-content {
            padding: 20px;
            text-align: center;
        }

        .card-content p {
            font-size: 1.1rem;
            margin: 5px 0;
        }

        .card-content .subtitle {
            font-size: 2.5rem;
            font-weight: bold;
            color: #3273dc;
        }

        /* Animations */
        @keyframes fadeInDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="menu-label">
            <img src="/static/logo.png" alt="Logo" class="sidebar-logo">
        </div>

        <ul class="menu-list">
            <li>
                <a href="/dashboard" class="navbar-item">
                    <span class="fas fa-home"></span>
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="/heatmap" class="navbar-item">
                    <span class="fas fa-map"></span>
                    <span>Interactive Heatmap</span>
                </a>
            </li>
            <li>
                <a href="/regression" class="navbar-item">
                    <span class="fas fa-chart-line"></span>
                    <span>Regression Analysis</span>
                </a>
            </li>
            <hr>
            <li>
                <a href="/" class="navbar-item">
                    <span class="fas fa-sign-out-alt"></span>
                    <span>Sign Out</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Sidebar Toggle Button -->
    <div id="toggleSidebar" class="toggle-sidebar">
        <span class="fas fa-bars"></span>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="main-content">
        <div class="header">
            <h1>Dashboard Overview</h1>
        </div>

        <!-- Total Data Card -->
        <div class="card" style="animation: fadeIn 1.5s;">
            <div class="card-header">
                Total Data Collected
            </div>
            <div class="card-content">
                <p class="subtitle">{{ total_data_collected }}</p>
            </div>
        </div>

        <!-- HDBSCAN Clustering Results -->
        <div class="card" style="animation: fadeIn 1.8s;">
            <div class="card-header">
                HDBSCAN Clustering Results
            </div>
            <div class="card-content">
                {{ cluster_plot_html|safe }}
            </div>
        </div>

        <!-- Heatmap -->
        <div class="card" style="animation: slideUp 2s;">
            <div class="card-header">
                Geographic Heatmap
            </div>
            <div class="card-content">
                <iframe src="{{ heatmap_url }}" width="100%" height="600px" style="border: none;"></iframe>
            </div>
        </div>
    </div>

    <script>
        // Add hover effects to sidebar links
        const sidebarLinks = document.querySelectorAll('.sidebar ul li a');
        sidebarLinks.forEach(link => {
            link.addEventListener('mouseover', () => {
                link.style.transform = 'translateX(10px)';
            });
            link.addEventListener('mouseleave', () => {
                link.style.transform = 'translateX(0)';
            });
        });

         const sidebar = document.getElementById('sidebar');
        const toggleSidebar = document.getElementById('toggleSidebar');
        const mainContent = document.getElementById('mainContent');

        toggleSidebar.addEventListener('click', () => {
            sidebar.classList.toggle('hidden');
            toggleSidebar.classList.toggle('hidden');
            mainContent.classList.toggle('collapsed');
        });
    </script>
</body>
</html>
